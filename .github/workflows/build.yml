name: Build Tavrynexo Player

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Locate project
        shell: pwsh
        run: |
          $csproj = Get-ChildItem -Recurse -Filter TavrynexoPlayer.csproj | Select-Object -First 1
          if (-not $csproj) { throw "TavrynexoPlayer.csproj not found in repository" }
          $root = $csproj.Directory.Parent.Parent.FullName
          if (-not (Test-Path "$root/installer/TavrynexoPlayer.iss")) { throw "installer folder not found next to src" }
          if (-not (Test-Path "$root/msix/AppxManifest.xml")) { throw "msix folder not found next to src" }
          "PROJ=$($csproj.FullName -replace '\\','/')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ROOT=$($root -replace '\\','/')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compute version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}".TrimStart('v') } else { $v = "1.0.${{ github.run_number }}" }
          $parts = $v.Split('.')
          while ($parts.Count -lt 3) { $parts += '0' }
          $v3 = ($parts[0..2] -join '.')
          "version=$v3" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "msixversion=$v3.0" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Version: $v3  MSIX: $v3.0"

      - name: Restore
        run: dotnet restore "${{ env.PROJ }}" -r win-x64

      - name: Publish
        run: >
          dotnet publish "${{ env.PROJ }}"
          -c Release -r win-x64 --self-contained true --no-restore
          -o "${{ env.ROOT }}/publish"
          -p:Version=${{ steps.ver.outputs.version }}
          -p:DebugType=None -p:DebugSymbols=false

      - name: Verify output
        shell: pwsh
        run: |
          if (!(Test-Path "${{ env.ROOT }}/publish/TavrynexoPlayer.exe")) { throw "TavrynexoPlayer.exe not found" }
          if (!(Test-Path "${{ env.ROOT }}/publish/libvlc")) { throw "libvlc folder missing" }

      - name: Create portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ env.ROOT }}/artifacts" | Out-Null
          Compress-Archive -Path "${{ env.ROOT }}/publish/*" -DestinationPath "${{ env.ROOT }}/artifacts/TavrynexoPlayer-${{ steps.ver.outputs.version }}-portable-win-x64.zip" -Force

      # ------------------------------------------------------------------ MSIX (Microsoft Store)
      - name: Build MSIX package
        shell: pwsh
        run: |
          $root = "${{ env.ROOT }}"
          $layout = "$root/msix-layout"
          if (Test-Path $layout) { Remove-Item $layout -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $layout | Out-Null
          Copy-Item "$root/publish/*" $layout -Recurse -Force
          Copy-Item "$root/msix/Assets" "$layout/Assets" -Recurse -Force
          $manifest = (Get-Content "$root/msix/AppxManifest.xml" -Raw).Replace("VERSION_PLACEHOLDER", "${{ steps.ver.outputs.msixversion }}")
          Set-Content -Path "$layout/AppxManifest.xml" -Value $manifest -Encoding utf8

          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter makeappx.exe |
                      Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $makeappx) { throw "makeappx.exe not found" }
          Write-Host "Using $($makeappx.FullName)"

          New-Item -ItemType Directory -Force -Path "$root/artifacts" | Out-Null
          $msix = "$root/artifacts/TavrynexoPlayer_${{ steps.ver.outputs.msixversion }}_x64.msix"
          & $makeappx.FullName pack /d $layout /p $msix /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed" }

          # .msixupload = zip that contains the .msix (accepted by Partner Center)
          $zip = "$root/artifacts/TavrynexoPlayer_${{ steps.ver.outputs.msixversion }}_x64.zip"
          Compress-Archive -Path $msix -DestinationPath $zip -Force
          Move-Item $zip "$root/artifacts/TavrynexoPlayer_${{ steps.ver.outputs.msixversion }}_x64.msixupload" -Force

      - name: Create test-signed MSIX (for sideload testing only)
        continue-on-error: true
        shell: pwsh
        run: |
          $root = "${{ env.ROOT }}"
          $publisher = "CN=DB86E487-92CC-4FB9-BDBC-F161416E3A4E"
          $cert = New-SelfSignedCertificate -Type Custom -Subject $publisher -KeyUsage DigitalSignature -FriendlyName "Tavrynexo Player Test" `
                    -CertStoreLocation "Cert:\CurrentUser\My" -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pw = ConvertTo-SecureString -String "TavrynexoTest1!" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "$root/test.pfx" -Password $pw | Out-Null
          Export-Certificate -Cert $cert -FilePath "$root/artifacts/TavrynexoPlayer-TestCertificate.cer" | Out-Null
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
                      Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          $test = "$root/artifacts/TavrynexoPlayer_${{ steps.ver.outputs.msixversion }}_x64_TEST-SIGNED.msix"
          Copy-Item "$root/artifacts/TavrynexoPlayer_${{ steps.ver.outputs.msixversion }}_x64.msix" $test
          & $signtool.FullName sign /fd SHA256 /f "$root/test.pfx" /p "TavrynexoTest1!" $test
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }

      # ------------------------------------------------------------------ Classic installer
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.ver.outputs.version }}" "${{ env.ROOT }}/installer/TavrynexoPlayer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Upload Microsoft Store package
        uses: actions/upload-artifact@v4
        with:
          name: TavrynexoPlayer-Store-MSIX
          path: |
            ${{ env.ROOT }}/artifacts/TavrynexoPlayer_*_x64.msix
            ${{ env.ROOT }}/artifacts/TavrynexoPlayer_*_x64.msixupload

      - name: Upload test-signed MSIX
        uses: actions/upload-artifact@v4
        with:
          name: TavrynexoPlayer-MSIX-Test-Signed
          path: |
            ${{ env.ROOT }}/artifacts/*TEST-SIGNED.msix
            ${{ env.ROOT }}/artifacts/*TestCertificate.cer
          if-no-files-found: ignore

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: TavrynexoPlayer-Setup
          path: ${{ env.ROOT }}/artifacts/TavrynexoPlayer-Setup-*.exe

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: TavrynexoPlayer-Portable
          path: ${{ env.ROOT }}/artifacts/*-portable-win-x64.zip

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ROOT }}/artifacts/TavrynexoPlayer-Setup-*.exe
            ${{ env.ROOT }}/artifacts/*-portable-win-x64.zip
            ${{ env.ROOT }}/artifacts/TavrynexoPlayer_*_x64.msix
          generate_release_notes: true

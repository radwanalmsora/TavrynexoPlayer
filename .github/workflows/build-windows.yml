name: Build Tavrynexo Player EXE (Windows x64)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Ninja and CMake
      uses: seanmcelroy/setup-ninja@v1.0.3

    - name: Setup MSVC Compiler
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install Qt 6.6
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.6.2'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'
        modules: 'qtquickcontrols2'

    - name: Install Vulkan SDK
      uses: humbletim/setup-vulkan-sdk@v1.2.0
      with:
        vulkan-query-version: 1.3.268.0
        vulkan-components: Vulkan-Headers, Vulkan-Loader

    - name: Configure CMake
      run: |
        cmake -B build -S TavrynexoPlayer -G "Ninja" `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}"

    - name: Build TavrynexoPlayer.exe
      run: |
        cmake --build build --config Release

    - name: Package Standalone Deployment (windeployqt)
      run: |
        mkdir dist
        copy build\TavrynexoPlayer.exe dist\
        windeployqt --qmldir TavrynexoPlayer\qml --release --no-translations dist\TavrynexoPlayer.exe

    - name: Upload Standalone EXE Package
      uses: actions/upload-artifact@v4
      with:
        name: TavrynexoPlayer-Windows-x64
        path: dist/

name: Build Tavrynexo Player Windows

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows x64 Release
    runs-on: windows-2022

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSVC Toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt 6.6.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          cache: false

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          
          Write-Host "Querying latest active Vulkan SDK version from LunarG API..."
          $versionData = Invoke-RestMethod -Uri "https://vulkan.lunarg.com/sdk/latest.json"
          $vulkanVer = $versionData.windows
          Write-Host "Found active Vulkan SDK version: $vulkanVer"
          
          $installer = "VulkanSDK-$vulkanVer-Installer.exe"
          $downloadUrl = "https://sdk.lunarg.com/sdk/download/$vulkanVer/windows/$installer"
          Write-Host "Downloading Vulkan SDK installer from: $downloadUrl..."
          Invoke-WebRequest -Uri $downloadUrl -OutFile $installer
          
          Write-Host "Executing silent installation to C:\VulkanSDK..."
          Start-Process -FilePath ".\$installer" -ArgumentList "--root C:\VulkanSDK --accept-licenses --default-answer --confirm-command install" -Wait
          Remove-Item $installer -Force -ErrorAction SilentlyContinue
          
          if (Test-Path "C:\VulkanSDK") {
            Write-Host "Vulkan SDK verified at C:\VulkanSDK"
            "VULKAN_SDK=C:\VulkanSDK" | Out-File -FilePath $env:GITHUB_ENV -Append
            "C:\VulkanSDK\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          } else {
            $foundDir = Get-ChildItem "C:\VulkanSDK*" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($foundDir) {
              Write-Host "Vulkan SDK verified at $($foundDir.FullName)"
              "VULKAN_SDK=$($foundDir.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
              "$($foundDir.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
            }
          }

      - name: Download & Extract FFmpeg Shared
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip"
          Write-Host "Downloading FFmpeg shared build..."
          Invoke-WebRequest -Uri $url -OutFile "ffmpeg.zip"
          Write-Host "Extracting FFmpeg to temporary directory..."
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "$env:RUNNER_TEMP\ffmpeg_temp" -Force
          $extracted = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg_temp" -Directory | Select-Object -First 1
          Move-Item -Path $extracted.FullName -Destination "C:\ffmpeg"
          "FFMPEG_DIR=C:\ffmpeg" | Out-File -FilePath $env:GITHUB_ENV -Append
          "C:\ffmpeg\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          Remove-Item "ffmpeg.zip" -Force -ErrorAction SilentlyContinue

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR;C:\ffmpeg;C:\VulkanSDK" `
            -DFFMPEG_ROOT="C:\ffmpeg" `
            -DVulkan_ROOT="C:\VulkanSDK"

      - name: Build Tavrynexo Player
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: Package with windeployqt & FFmpeg DLLs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "package/TavrynexoPlayer"
          Copy-Item "build\Release\TavrynexoPlayer.exe" "package\TavrynexoPlayer\"
          
          # Deploy Qt runtime and QML plugins
          $windeployqt = "$env:QT_ROOT_DIR\bin\windeployqt.exe"
          & $windeployqt --release --qmldir qml --compiler-runtime package\TavrynexoPlayer\TavrynexoPlayer.exe
          
          # Copy FFmpeg shared libraries
          Copy-Item "C:\ffmpeg\bin\*.dll" "package\TavrynexoPlayer\" -Force
          
          # Create compressed ZIP bundle
          Compress-Archive -Path "package\TavrynexoPlayer\*" -DestinationPath "TavrynexoPlayer-Windows-x64.zip" -CompressionLevel Optimal

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TavrynexoPlayer-Windows-x64
          path: TavrynexoPlayer-Windows-x64.zip
          retention-days: 14

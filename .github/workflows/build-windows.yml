name: Build Tavrynexo Player EXE (Windows x64)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup MSVC Compiler
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install Qt 6.6
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.6.2'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'
        modules: 'qtquickcontrols2'

    - name: Configure CMake (Visual Studio 2022)
      run: |
        cmake -B build -S TavrynexoPlayer -G "Visual Studio 17 2022" -A x64 `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}"

    - name: Build TavrynexoPlayer.exe
      run: |
        cmake --build build --config Release --parallel

    - name: Package Standalone Deployment (windeployqt)
      run: |
        mkdir dist
        copy build\Release\TavrynexoPlayer.exe dist\
        & "${{ env.Qt6_DIR }}\bin\windeployqt.exe" --qmldir TavrynexoPlayer\qml --release --no-translations dist\TavrynexoPlayer.exe

    - name: Upload Standalone EXE Package
      uses: actions/upload-artifact@v4
      with:
        name: TavrynexoPlayer-Windows-x64
        path: dist/

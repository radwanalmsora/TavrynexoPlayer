name: Build Tavrynexo Player (Windows x64)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # يتيح لك تشغيل البناء يدوياً بنقرة زر من تبويب Actions

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Ninja and CMake
      uses: seanmcelroy/setup-ninja@v1.0.3

    - name: Install Qt 6.6
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.6.2'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'
        modules: 'qtquickcontrols2'

    - name: Setup MSVC Environment
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install Vulkan SDK
      uses: humbletim/setup-vulkan-sdk@v1.2.0
      with:
        vulkan-query-version: 1.3.268.0
        vulkan-components: Vulkan-Headers, Vulkan-Loader

    - name: Cache vcpkg dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/vcpkg
          vcpkg_installed
        key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-

    - name: Configure CMake
      run: |
        cmake -B build -G "Ninja" `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}"

    - name: Build Executable
      run: |
        cmake --build build --config Release

    - name: Package Standalone Windows Deployment (windeployqt)
      run: |
        mkdir dist
        copy build\TavrynexoPlayer.exe dist\
        windeployqt --qmldir qml --release --no-translations dist\TavrynexoPlayer.exe

    - name: Upload Windows Standalone Artifact (.EXE Bundle)
      uses: actions/upload-artifact@v4
      with:
        name: TavrynexoPlayer-Windows-x64
        path: dist/
